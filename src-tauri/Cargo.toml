[package]
name = "yt-downloader"
version = "1.0.0"
description = "YT Downloader - a modern desktop workbench for downloading video with yt-dlp and FFmpeg"
authors = ["YT Downloader"]
edition = "2021"
rust-version = "1.77.2"

# The desktop shell is deliberately thin: every capability lives in the library so the
# backend can be exercised by `cargo test` without opening a window.
[lib]
name = "yt_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Required for production builds. Tauri's own build script derives
# `dev = !custom_protocol`; a release binary built without this feature serves
# `devUrl` (http://localhost:1420) instead of the frontend embedded in it, which
# shows up as "localhost refused to connect" in a release folder.
#
# `cargo build --release --features custom-protocol` is therefore the only correct
# way to produce a shippable executable; scripts/build.ps1 does exactly that, and
# the guard in `src/lib.rs` refuses to compile a release build without it.
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
regex = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
walkdir = "2"

tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }

# Release builds favour start-up time and a small footprint over compile time.
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
panic = "abort"
incremental = false
